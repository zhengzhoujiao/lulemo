<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">噜了么 · 记录日常，找回自己的节奏</title>
  <desc id="desc">男性健康自我管理工具，将每日打卡、趣味抛币与社区陪伴连在一起。右侧是使用手机记录日常的卡通简笔成年男性，插画为概念展示。</desc>
