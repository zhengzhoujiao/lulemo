      <text x="64" y="249" font-size="38" font-weight="650" fill="#29213c">记录日常，</text>
      <text x="64" y="301" font-size="38" font-weight="650" fill="#29213c">找回自己的节奏。</text>
      <text x="64" y="348" font-size="22" fill="#675c79">从一次打卡，到一群人的日常陪伴。</text>
